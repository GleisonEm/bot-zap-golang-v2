version: '3.9'
services:
  whatsapp_go:
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    image: "aldinokemal2104/go-whatsapp-web-multidevice:latest"
    build:
      context: .
      dockerfile: ./docker/golang.Dockerfile
    restart: 'always'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${DOMAIN_HOST}`)" # Adapte para seu domínio
      - "traefik.http.routers.api.entrypoints=websecure" # Use HTTPS (websecure)
      - "traefik.http.routers.api.tls.certresolver=myresolver" # Config. do certificado
      - "traefik.http.services.api.loadbalancer.server.port=3002"

    networks:
      - proxy

networks:
  proxy:
    external: true
